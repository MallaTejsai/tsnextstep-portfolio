    <script type="module" id="app-src" src="/src/main.jsx"></script>
    <script>
      /* Opened by double-click (file://)? The dev module script cannot run from disk.
         Send this page to the built single-file site instead — or explain how to build. */
      (function () {
        if (location.protocol !== "file:") return;

        /* Only the source entry loads an external dev script; built/standalone
           pages carry an inlined app script and are left untouched. */
        var src = document.getElementById("app-src");
        if (!src || !src.getAttribute("src")) return;

        if (src.parentNode) src.parentNode.removeChild(src);

        var probe = new Image();
        probe.onload = function () {
          location.replace("./dist/index.html");
        };
        probe.onerror = function () {
          document.body.insertAdjacentHTML(
            "beforeend",
            '<div style="max-width:44rem;margin:4rem auto;padding:1.5rem 1.75rem;' +
              "color:#f4f4f6;font-family:system-ui,sans-serif;line-height:1.7;" +
              'background:#0d0d10;border:1px solid rgba(255,45,63,.45);border-radius:14px">' +
              '<h1 style="margin:0 0 .75rem;font-size:1.35rem;color:#ff5c68">Nothing to show yet</h1>' +
              '<p style="margin:0 0 .75rem">This is the source entry point — it needs a build. ' +
              "Run <code>npm run build</code> (or <code>npm run dev</code>) in the " +
              "<code>portfolio/</code> folder, then open <code>dist/index.html</code>.</p>" +
              '<p style="margin:0;color:#a9a9b4">See README.md for setup.</p></div>'
          );
        };
        probe.src = "./dist/favicon.svg";
      })();
    </script>
